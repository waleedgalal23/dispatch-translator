<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم الديسباتش الفوري</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- العنوان -->
        <h1> مترجم الديسباتش الفوري</h1>
        <p class="subtitle">ترجمة فورية للعاملين في مجال اللوجستيات</p>

        <!-- اختيار اللغة -->
        <div class="language-selector">
            <label for="languageSelect">اتجاه الترجمة:</label>
            <select id="languageSelect">
                <option value="ar-en">عربي ← إنجليزي</option>
                <option value="en-ar">إنجليزي ← عربي</option>
            </select>
        </div>

        <!-- أزرار التحكم -->
        <div class="controls">
            <button id="startBtn" class="btn btn-primary">🎤 بدء المكالمة</button>
            <button id="stopBtn" class="btn btn-danger" disabled>️ إيقاف</button>
        </div>

        <!-- النص الأصلي -->
        <div class="text-section">
            <h3>📝 النص الأصلي:</h3>
            <div id="originalText" class="text-box">اضغط "بدء المكالمة" وتحدث...</div>
        </div>

        <!-- الترجمة -->
        <div class="text-section">
            <h3> الترجمة:</h3>
            <div id="translatedText" class="text-box">الترجمة ستظهر هنا...</div>
        </div>

        <!-- اقتراحات الردود -->
        <div class="suggestions-section">
            <h3>💡 اقتراحات الردود:</h3>
            <div id="suggestions" class="suggestions-box">
                <p class="empty-message">ستظهر الاقتراحات أثناء المكالمة</p>
            </div>
        </div>

        <!-- سجل المكالمات -->
        <div class="history-section">
            <h3> سجل المكالمات:</h3>
            <div id="callHistory" class="history-box">
                <p class="empty-message">لا توجد مكالمات سابقة</p>
            </div>
        </div>

        <!-- إعدادات API -->
        <div class="api-section">
            <h3>⚙️ إعدادات الذكاء الاصطناعي:</h3>
            <div class="input-group">
                <label for="apiToken">Hugging Face API Token:</label>
                <input type="password" id="apiToken" placeholder="hf_...">
                <button id="saveTokenBtn" class="btn btn-small">حفظ</button>
            </div>
            <div id="apiStatus" class="status-text"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
